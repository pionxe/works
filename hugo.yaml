baseURL: "https://works.yuisui.workers.dev/"
title: "夜航 · works"
locale: "zh-CN"
defaultContentLanguage: "zh"
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
pygmentsUseClasses: true

pagination:
  pagerSize: 10

theme: ["PaperMod"]

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30

params:
  env: production
  description: "这些字多是夜里写的，说给自己听。白天想不通的事，写到纸上才慢慢理顺；一篇篇攒下来，攒得久了，就成了这趟夜航。"
  author: pionxe
  DateFormat: "2006-01-02"
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: false
  ShowPostNavLinks: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true
  disableSpecial1stPost: true
  mainSections: ["posts"]
  homeInfoParams:
    Title: "夜航"
    Content: "这些字多是夜里写的，说给自己听。白天想不通的事，写到纸上才慢慢理顺；一篇篇攒下来，攒得久了，就成了这趟夜航。"
  label:
    text: "夜航 · works"
  footer:
    text: "月光照在深海上，也照着写给黑夜的代码。"
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.svg"
    favicon32x32: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"
    theme_color: "#080c14"
