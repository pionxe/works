<!-- Back to Top Button -->
<button id="back-to-top" aria-label="回到顶部" title="回到顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // --- 1. Top Reading Progress Bar Listener ---
  const progressBar = document.getElementById('reading-progress-bar');
  if (progressBar) {
    window.addEventListener('scroll', function() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
    });
  }

  // --- 2. Inject Mac Terminal Window Dots to Code Blocks ---
  const codeBlocks = document.querySelectorAll('.highlight, pre');
  codeBlocks.forEach(function(block) {
    if (block.querySelector('.mac-window-bar')) return; // Avoid duplicate

    const header = document.createElement('div');
    header.className = 'mac-window-bar';
    
    // Language detection or title
    let lang = '';
    const codeEl = block.querySelector('code');
    if (codeEl) {
      const matches = codeEl.className.match(/language-([a-zA-Z0-9]+)/);
      if (matches && matches[1]) {
        lang = matches[1].toUpperCase();
      }
    }
    
    header.innerHTML = `
      <span class="mac-dot mac-dot-close"></span>
      <span class="mac-dot mac-dot-minimize"></span>
      <span class="mac-dot mac-dot-maximize"></span>
      <span class="mac-window-title">${lang ? lang : 'TERMINAL'}</span>
    `;

    block.insertBefore(header, block.firstChild);
  });

  // --- 3. Back to Top Button ---
  const backToTopBtn = document.getElementById('back-to-top');
  if (backToTopBtn) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // --- 4. ScrollSpy for TOC Links ---
  const tocLinks = document.querySelectorAll('.toc-sidebar a, #TOC a');
  if (tocLinks.length > 0) {
    const headings = Array.from(document.querySelectorAll('h1[id], h2[id], h3[id], h4[id]'));
    
    window.addEventListener('scroll', function() {
      let currentHeadingId = '';
      const scrollPos = window.scrollY + 120;
      
      headings.forEach(function(h) {
        if (h.offsetTop <= scrollPos) {
          currentHeadingId = h.getAttribute('id');
        }
      });
      
      tocLinks.forEach(function(link) {
        link.classList.remove('active');
        if (currentHeadingId && link.getAttribute('href') === '#' + currentHeadingId) {
          link.classList.add('active');
        }
      });
    });
  }
});
</script>
