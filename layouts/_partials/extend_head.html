<!-- Blurred Night Sea Background Image Overlay -->
<div class="bg-image-overlay"></div>

<!-- Top Reading Progress Bar -->
<div id="reading-progress-bar"></div>

<!-- Background Starfield Particle Canvas -->
<canvas id="starfield-canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('starfield-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let stars = [];
  const numStars = 60;
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  
  function createStars() {
    stars = [];
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.7 + 0.1,
        speed: Math.random() * 0.005 + 0.002,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const time = Date.now() * 0.001;
    
    for (let i = 0; i < stars.length; i++) {
      const star = stars[i];
      const currentAlpha = star.alpha + Math.sin(time * star.speed * 50 + star.phase) * 0.25;
      const clampedAlpha = Math.max(0.05, Math.min(0.85, currentAlpha));

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(226, 232, 240, ${clampedAlpha})`;
      ctx.fill();

      star.y -= 0.15;
      if (star.y < 0) {
        star.y = canvas.height;
        star.x = Math.random() * canvas.width;
      }
    }
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    createStars();
  });

  resizeCanvas();
  createStars();
  drawStars();
})();
</script>
